<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Яндекс Плюс × Яндекс 01 — прототип</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="css/base.css?v=20">
  <link rel="stylesheet" href="css/plus.css?v=20">
  <link rel="stylesheet" href="css/y01.css?v=20">
  <link rel="stylesheet" href="css/smysl.css?v=20">
  <link rel="stylesheet" href="css/meidzi.css?v=20">

  <link rel="stylesheet" href="css/demo.css?v=20">

<body>
  <div id="stage">
    <div id="phone">
      <div id="screen">
        <div id="statusbar"><span class="sb-time"></span><span class="sb-island"></span><span class="sb-icons"><i class="sig"></i><i class="wifi"></i><i class="bat"></i></span></div>

        <!-- Яндекс Плюс -->
        <div id="plus">
          <div class="page" data-page="home"></div>
          <div class="page" data-page="kp"></div>
          <div class="page" data-page="music"></div>
          <div class="page" data-page="books"></div>
          <div class="page" data-page="profile"></div>
          <div id="miniplayer"></div>
          <nav id="tabbar"></nav>
        </div>

        <!-- Мини-апп Яндекс 01 внутри Плюса -->
        <div id="y01" aria-hidden="true">
          <header class="y01-head"></header>
          <div class="y01-body">
            <section class="y01-screen" data-screen="today"></section>
            <section class="y01-screen" data-screen="lumen"></section>
            <section class="y01-screen" data-screen="map"></section>
            <section class="y01-screen" data-screen="visit"></section>
          </div>
          <nav class="y01-nav"></nav>
        </div>

        <!-- Мини-апп резидента: Meidzi -->
        <div id="meidzi"></div>
        <div id="smysl"></div>

        <div id="scene"></div>
        <div id="sheet"></div>
        <div id="lock"></div>
        <div id="pushes"></div>
        <div id="toast"></div>
        <div id="story"></div>
        <div class="home-indicator"></div>
      </div>
    </div>
    <aside id="guide"></aside>
  </div>

  <script src="js/data.js?v=20"></script>
  <script src="js/art.js?v=20"></script>
  <script src="js/store.js?v=20"></script>
  <script src="js/ui.js?v=20"></script>
  <script src="js/plus.js?v=20"></script>
  <script src="js/smysl.js?v=20"></script>
  <script src="js/meidzi.js?v=20"></script>
